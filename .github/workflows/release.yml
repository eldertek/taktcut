name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform_id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_id: windows
            artifact_name: TaktCut-Windows.exe
          - os: macos-latest
            platform_id: macos
            artifact_name: TaktCut-macOS.zip
          - os: ubuntu-latest
            platform_id: linux
            artifact_name: TaktCut-Linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install taktcut and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build 1-click binary with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --name TaktCut --collect-data taktcut --collect-submodules taktcut --collect-data opentimelineio src/taktcut/desktop_entry.py

      - name: Package and smoke-test Windows binary
        if: matrix.platform_id == 'windows'
        shell: pwsh
        run: |
          .\dist\TaktCut.exe --help
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item dist\TaktCut.exe release-assets\TaktCut-Windows.exe

      - name: Package and smoke-test Linux binary
        if: matrix.platform_id == 'linux'
        run: |
          chmod +x dist/TaktCut
          ./dist/TaktCut --help
          mkdir -p release-assets
          cp dist/TaktCut release-assets/TaktCut-Linux
          chmod +x release-assets/TaktCut-Linux

      - name: Package and smoke-test macOS binary
        if: matrix.platform_id == 'macos'
        run: |
          chmod +x dist/TaktCut
          ./dist/TaktCut --help
          mkdir -p release-assets
          cd dist
          zip -j ../release-assets/TaktCut-macOS.zip TaktCut

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum TaktCut-Windows.exe TaktCut-macOS.zip TaktCut-Linux > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract structured release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          import os, re, subprocess
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          ver = tag.lstrip("v")
          repo = os.environ["REPO"]
          changelog = Path("CHANGELOG.md")
          section = ""
          if changelog.is_file():
              text = changelog.read_text(encoding="utf-8")
              pattern = rf"(?ms)^## \[?{re.escape(ver)}\]?[^\n]*\n(.*?)(?=^## |\Z)"
              m = re.search(pattern, text)
              if m:
                  section = m.group(0).strip()

          tags = subprocess.run(
              ["git", "tag", "--sort=-v:refname"],
              capture_output=True, text=True, check=False
          ).stdout.splitlines()
          prev_tag = next((t for t in tags if t != tag and t.startswith("v")), "")

          parts = []
          if section:
              parts.append(section)
          else:
              parts.append(f"## {tag}\n\nRelease `{tag}` of TaktCut Studio.")

          parts.append(
              "### Downloads\n"
              "- **Windows (x64)**: `TaktCut-Windows.exe` (standalone 1-click binary)\n"
              "- **macOS (Apple Silicon / Universal)**: `TaktCut-macOS.zip`\n"
              "- **Linux (x64)**: `TaktCut-Linux`\n"
              "- **Checksums**: `SHA256SUMS.txt`\n\n"
              "Live web demo: https://eclipse-technology.eu/demos/taktcut/"
          )
          if prev_tag:
              parts.append(f"**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag}")

          Path("release-notes.md").write_text("\n\n".join(parts) + "\n", encoding="utf-8")
          print(Path("release-notes.md").read_text(encoding="utf-8"))

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TaktCut ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/TaktCut-Windows.exe
            dist/TaktCut-macOS.zip
            dist/TaktCut-Linux
            dist/SHA256SUMS.txt
          generate_release_notes: false
          fail_on_unmatched_files: true
