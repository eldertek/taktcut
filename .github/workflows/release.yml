name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform_id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_id: windows
            artifact_name: TaktCut-Windows.exe
          - os: macos-latest
            platform_id: macos
            artifact_name: TaktCut-macOS.zip
          - os: ubuntu-latest
            platform_id: linux
            artifact_name: TaktCut-Linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install taktcut and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build 1-click binary with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --name TaktCut --collect-data taktcut --collect-data opentimelineio src/taktcut/desktop_entry.py

      - name: Package and smoke-test Windows binary
        if: matrix.platform_id == 'windows'
        shell: pwsh
        run: |
          .\dist\TaktCut.exe --help
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item dist\TaktCut.exe release-assets\TaktCut-Windows.exe

      - name: Package and smoke-test Linux binary
        if: matrix.platform_id == 'linux'
        run: |
          chmod +x dist/TaktCut
          ./dist/TaktCut --help
          mkdir -p release-assets
          cp dist/TaktCut release-assets/TaktCut-Linux
          chmod +x release-assets/TaktCut-Linux

      - name: Package and smoke-test macOS binary
        if: matrix.platform_id == 'macos'
        run: |
          chmod +x dist/TaktCut
          ./dist/TaktCut --help
          mkdir -p release-assets
          cd dist
          zip -j ../release-assets/TaktCut-macOS.zip TaktCut

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum TaktCut-Windows.exe TaktCut-macOS.zip TaktCut-Linux > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TaktCut-Windows.exe
            dist/TaktCut-macOS.zip
            dist/TaktCut-Linux
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
